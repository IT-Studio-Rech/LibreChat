# The Female Way — LibreChat Configuration
# https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.9

cache: true

interface:
  modelSelect: false
  parameters: false
  # disabled for non-tech end-users
  bookmarks: false
  memories: false
  presets: false
  multiConvo: false
  prompts: false
  fileSearch: false
  runCode: false
  temporaryChat: true
  webSearch: true
  fileCitations: true
  agents:
    use: true
    create: false
    share: false
    public: false
  marketplace:
    use: false
  remoteAgents:
    use: false
  skills:
    use: false
  customFooter: "The Female Way © 2026"

modelSpecs:
  enforce: true
  list:
    - name: taras-ki-assistentin
      label: "Taras KI-Assistentin"
      description: "Deine persoenliche KI-Assistentin — auf die weibliche Art."
      default: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-4-6

    - name: gpt-4o
      label: "GPT-4o"
      description: "OpenAI GPT-4o — Alternative fuer Tara."
      preset:
        endpoint: openAI
        model: gpt-4o

    - name: gemini-2-5-pro
      label: "Gemini 2.5 Pro"
      description: "Google Gemini 2.5 Pro — Alternative fuer Tara."
      preset:
        endpoint: google
        model: gemini-2.5-pro

balance:
  enabled: true
  startBalance: 5000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: days
  refillAmount: 5000000

registration:
  socialLogins: []

actions:
  allowedDomains:
    - 'thefemalewayai.de'
